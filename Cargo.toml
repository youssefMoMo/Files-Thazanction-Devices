[package]
name = "lan-transfer-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "A minimal, encrypted LAN file-transfer core written in Rust"

[dependencies]
data-encoding = "=2.11.1"
getrandom = "=0.3.4"
sha2 = "=0.11.1"
snow = "=0.10.0"
rpassword = "=7.5.4"
zeroize = "=1.9.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
