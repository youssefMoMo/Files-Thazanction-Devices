name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Generate lockfile when not present
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'Cargo.lock')) {
            cargo +1.100.0 generate-lockfile
          }
      - name: Format
        run: cargo +1.100.0 fmt --check
      - name: Clippy
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.100.0 test --locked --all-targets
      - name: Release build
        run: cargo +1.100.0 build --locked --release
